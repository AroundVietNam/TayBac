<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Around Viet Nam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@500;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { theme: { extend: { fontFamily: { head: ['Epilogue', 'sans-serif'], body: ['"Open Sans"', 'sans-serif'] } } } }</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<style>
  :root { --bg: #fbf7ee; --ink: #1d2a21; }
  body { background: var(--bg); color: var(--ink); font-family: 'Open Sans', sans-serif; }
  .screen { height: 100vh; height: 100svh; }
  .panel { pointer-events: none; }
  .panel.on { pointer-events: auto; }
  .pol { transform: rotate(var(--r)); transition: transform .3s ease; }
  .pol:hover { transform: rotate(0deg) scale(1.1); z-index: 5; }
  @media (prefers-reduced-motion: reduce) { .pol { transition: none; } }
</style>
</head>
<body class="font-body antialiased">

<button id="lang" class="fixed top-3 right-3 z-50 rounded-full bg-black/55 px-3 py-1.5 text-sm text-white backdrop-blur" aria-label="Change language"></button>

<!-- HERO -->
<header id="hero" class="screen relative overflow-hidden text-white">
  <video id="heroVideo" class="absolute inset-0 h-full w-full object-cover" autoplay muted loop playsinline></video>
  <div class="absolute inset-0 bg-black/30"></div>
  <nav class="absolute inset-x-0 top-0 z-30 flex items-center gap-3 px-6 py-5">
    <!-- LOGO: put your <img src="logo.svg" class="h-8"> inside this span -->
    <span id="logo" class="inline-flex items-center">
      <img src="media/logo.webp" class="h-10">
    </span>
    <span class="min-w-0 truncate font-head text-2xl font-bold md:text-3xl" data-i18n="ui.name"></span>
  </nav>
  <div id="loader" class="absolute inset-0 z-20 grid place-items-center bg-[#16231b]">
    <div class="px-4 text-center">
      <h1 class="font-head text-5xl font-extrabold md:text-8xl" data-i18n="ui.name"></h1>
      <p class="mt-3 text-base text-white/70 md:text-xl" data-i18n="ui.loading"></p>
    </div>
  </div>
  <div class="absolute inset-x-0 bottom-0 z-30 grid grid-cols-[1fr_1fr_1fr_auto] border-t border-white/30 bg-black/25 backdrop-blur-sm">
    <div class="min-w-0 px-3 py-6 md:px-8"><p class="truncate text-sm font-semibold md:text-xl" data-i18n="hero.location.label"></p><p class="mt-1 truncate text-base text-white/80 md:text-2xl" data-i18n="hero.location.value"></p></div>
    <div class="min-w-0 border-l border-white/30 px-3 py-6 md:px-8"><p class="truncate text-sm font-semibold md:text-xl" data-i18n="hero.duration.label"></p><p class="mt-1 truncate text-base text-white/80 md:text-2xl" data-i18n="hero.duration.value"></p></div>
    <div class="min-w-0 border-l border-white/30 px-3 py-6 md:px-8"><p class="truncate text-sm font-semibold md:text-xl" data-i18n="hero.budget.label"></p><p class="mt-1 truncate text-base text-white/80 md:text-2xl" data-i18n="hero.budget.value"></p></div>
    <a id="plan" href="#" class="grid place-items-center bg-white px-4 text-sm font-semibold text-black transition hover:bg-white/85 md:px-12 md:text-xl"><span class="truncate" data-i18n="hero.plan"></span></a>
  </div>
</header>

<!-- SECTION TITLE (normal scroll, not pinned) -->
<h3 class="px-6 pb-8 pt-20 font-head text-4xl font-extrabold md:px-[10vw] md:text-6xl" data-i18n="ui.destinations"></h3>

<!-- DAYS (pinned, driven by GSAP ScrollTrigger) -->
<main id="days" class="screen relative overflow-hidden">
  <div id="panels"></div>
  <div id="timeline" class="absolute inset-x-0 bottom-[3vh] mx-auto hidden w-[min(560px,60vw)] md:block">
    <div id="labels" class="relative h-7 text-base"></div>
    <div class="relative mt-1 h-px bg-black/30">
      <i id="dot" class="absolute -top-[5px] left-0 h-[11px] w-[11px] rounded-full"></i>
    </div>
  </div>
</main>

<!-- MARQUEE -->
<section id="gallery" class="overflow-hidden py-24">
  <h2 class="mb-12 px-6 font-head text-4xl font-extrabold md:px-[10vw] md:text-6xl" data-i18n="marquee.title"></h2>
  <div id="track" class="flex w-max gap-3 pr-3 py-14 md:gap-6 md:pr-6"></div>
</section>

<!-- FOOTER -->
<footer class="py-10 text-center italic text-xl md:text-2xl" data-i18n="ui.footer"></footer>

<script src="main.js"></script>
</body>
</html>
